server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;  # backend caps files at EDUNEST_MAX_UPLOAD_MB (8)

  location /api/ws  {  # WebSockets: live messages + bus tracking
    proxy_pass http://backend:8000; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s;
  }
  location /api/    { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 120s; }
  location /vision/ { proxy_pass http://vision:5000/; proxy_buffering off; }  # MJPEG video_feed must not be buffered
  location /        { try_files $uri /index.html; }                           # SPA fallback
}
